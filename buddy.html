};


/* =====================================================
   STATE → DISTRICT
===================================================== */

const buddyState =
  document.getElementById("buddyState");

const buddyDistrict =
  document.getElementById("buddyDistrict");

const buddyHospital =
  document.getElementById("buddyHospital");


buddyState.addEventListener("change", function () {

  buddyDistrict.innerHTML =
    '<option value="">Select District</option>';

  buddyHospital.innerHTML =
    '<option value="">Select Hospital</option>';

  buddyDistrict.disabled = true;
  buddyHospital.disabled = true;

  const state = buddyState.value;

  if (!state || !hospitalData[state]) {
    return;
  }

  buddyDistrict.disabled = false;

  Object.keys(hospitalData[state])
    .sort()
    .forEach(function (district) {

      const option =
        document.createElement("option");

      option.value = district;
      option.textContent = district;

      buddyDistrict.appendChild(option);

    });

});


/* =====================================================
   DISTRICT → HOSPITAL
===================================================== */

buddyDistrict.addEventListener("change", function () {

  buddyHospital.innerHTML =
    '<option value="">Select Hospital</option>';

  buddyHospital.disabled = true;

  const state = buddyState.value;
  const district = buddyDistrict.value;

  if (
    !state ||
    !district ||
    !hospitalData[state] ||
    !hospitalData[state][district]
  ) {
    return;
  }

  buddyHospital.disabled = false;

  hospitalData[state][district]
    .forEach(function (hospital) {

      const option =
        document.createElement("option");

      option.value = hospital;
      option.textContent = hospital;

      buddyHospital.appendChild(option);

    });

});


/* =====================================================
   REGISTRATION
===================================================== */

const buddyForm =
  document.getElementById(
    "buddyRegistrationForm"
  );


buddyForm.addEventListener("submit", async function (event) {

  event.preventDefault();


  const submitButton =
    buddyForm.querySelector(
      'button[type="submit"]'
    );


  const password =
    document.getElementById(
      "buddyPassword"
    ).value;


  const confirmPassword =
    document.getElementById(
      "buddyPasswordConfirm"
    ).value;


  if (password !== confirmPassword) {

    alert("Passwords do not match.");
    return;

  }


  const languages =
    Array.from(
      document.querySelectorAll(
        'input[name="buddyLanguage"]:checked'
      )
    ).map(
      checkbox => checkbox.value
    );


  const services =
    Array.from(
      document.querySelectorAll(
        'input[name="buddyService"]:checked'
      )
    ).map(
      checkbox => checkbox.value
    );


  if (languages.length === 0) {

    alert(
      "Please select at least one language."
    );

    return;

  }


  if (services.length === 0) {

    alert(
      "Please select at least one service."
    );

    return;

  }


  const name =
    document.getElementById(
      "buddyName"
    ).value.trim();


  const phone =
    document.getElementById(
      "buddyPhone"
    ).value.trim();


  const email =
    document.getElementById(
      "buddyEmail"
    ).value.trim();


  const gender =
    document.getElementById(
      "buddyGender"
    ).value;


  const dob =
    document.getElementById(
      "buddyDob"
    ).value;


  const state =
    buddyState.value;


  const district =
    buddyDistrict.value;


  const hospital =
    buddyHospital.value;


  const qualification =
    document.getElementById(
      "buddyQualification"
    ).value;


  const qualificationDetails =
    document.getElementById(
      "buddyQualificationDetails"
    ).value.trim();


  const experience =
    document.getElementById(
      "buddyExperience"
    ).value.trim();


  const availability =
    document.getElementById(
      "buddyAvailability"
    ).value;


  const availabilityDetails =
    document.getElementById(
      "buddyAvailabilityDetails"
    ).value.trim();


  const about =
    document.getElementById(
      "buddyAbout"
    ).value.trim();


  const photoInput =
    document.getElementById(
      "buddyPhoto"
    );


  try {

    submitButton.disabled = true;

    submitButton.textContent =
      "Submitting Registration...";


    /* =============================================
       CREATE FIREBASE ACCOUNT
    ============================================= */

    const userCredential =
      await auth.createUserWithEmailAndPassword(
        email,
        password
      );


    const user =
      userCredential.user;


    /* =============================================
       PROFILE PHOTO
    ============================================= */

    let photoURL = "";


    if (
      photoInput &&
      photoInput.files &&
      photoInput.files.length > 0
    ) {

      const file =
        photoInput.files[0];


      if (
        ![
          "image/jpeg",
          "image/png",
          "image/webp"
        ].includes(file.type)
      ) {

        throw new Error(
          "Please upload a JPG, PNG or WebP image."
        );

      }


      if (file.size > 5 * 1024 * 1024) {

        throw new Error(
          "Profile photo must be smaller than 5 MB."
        );

      }


      const storageRef =
        storage
          .ref()
          .child(
            "buddy_profiles/" +
            user.uid +
            "/profile_photo"
          );


      await storageRef.put(file);

      photoURL =
        await storageRef.getDownloadURL();

    }


    /* =============================================
       SAVE BUDDY PROFILE
    ============================================= */

    await db
      .collection("hospital_buddies")
      .doc(user.uid)
      .set({

        uid:
          user.uid,

        name:
          name,

        phone:
          phone,

        email:
          email,

        gender:
          gender,

        dob:
          dob,

        state:
          state,

        district:
          district,

        hospital:
          hospital,

        languages:
          languages,

        qualification:
          qualification,

        qualificationDetails:
          qualificationDetails,

        experience:
          experience,

        services:
          services,

        availability:
          availability,

        availabilityDetails:
          availabilityDetails,

        about:
          about,

        photoURL:
          photoURL,

        status:
          "pending",

        approved:
          false,

        createdAt:
          firebase.firestore
            .FieldValue
            .serverTimestamp(),

        updatedAt:
          firebase.firestore
            .FieldValue
            .serverTimestamp()

      });


    /* =============================================
       SIGN OUT AFTER REGISTRATION
    ============================================= */

    await auth.signOut();


    /* =============================================
       SUCCESS
    ============================================= */

    showBuddyResult(`

      <div class="resultIcon">
        ✅
      </div>

      <h2>
        Registration Submitted
      </h2>

      <p>
        Your Hospital Buddy registration has been
        submitted successfully.
      </p>

      <div class="contact">

        <b>Name:</b>
        ${escapeBuddyHTML(name)}

        <br><br>

        <b>District:</b>
        ${escapeBuddyHTML(district)}

        <br><br>

        <b>Hospital:</b>
        ${escapeBuddyHTML(hospital)}

        <br><br>

        <b>Status:</b>
        Pending Administrator Review

      </div>

      <p class="privateText">

        Your profile will be reviewed by the
        Hospital Buddy administrator before approval.

      </p>

      <button
        class="btn primaryBtn"
        type="button"
        onclick="closeBuddyModal()"
      >
        Done
      </button>

    `);


    buddyForm.reset();

    buddyDistrict.innerHTML =
      '<option value="">Select District</option>';

    buddyHospital.innerHTML =
      '<option value="">Select Hospital</option>';

    buddyDistrict.disabled = true;
    buddyHospital.disabled = true;


  } catch (error) {

    console.error(
      "Buddy registration error:",
      error
    );


    let message =
      "Unable to submit registration.";


    if (
      error.code ===
      "auth/email-already-in-use"
    ) {

      message =
        "This email address is already registered.";

    }


    else if (
      error.code ===
      "auth/invalid-email"
    ) {

      message =
        "Please enter a valid email address.";

    }


    else if (
      error.code ===
      "auth/weak-password"
    ) {

      message =
        "Password must be at least 6 characters.";

    }


    else if (error.message) {

      message =
        error.message;

    }


    alert(message);


    submitButton.disabled = false;

    submitButton.textContent =
      "🤝 Submit Buddy Registration";

  }

});


/* =====================================================
   MODAL
===================================================== */

function showBuddyResult(html) {

  const modal =
    document.getElementById(
      "buddyModal"
    );

  const result =
    document.getElementById(
      "buddyResult"
    );

  result.innerHTML = html;

  modal.classList.remove("hidden");

}


function closeBuddyModal() {

  document
    .getElementById("buddyModal")
    .classList.add("hidden");

}


/* =====================================================
   HTML SECURITY
===================================================== */

function escapeBuddyHTML(value) {

  return String(value ?? "")

    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}

</script>
